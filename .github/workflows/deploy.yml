name: Build e Deploy no Railway

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker e publica no GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/marcostaccon/prenotami-bot:latest .
          docker push ghcr.io/marcostaccon/prenotami-bot:latest

      - name: Atualiza Railway para usar nova imagem
        run: |
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"4067ef37-1e44-46e1-9b42-ba62c94fba4a\", environmentId: \"460ed2db-7de0-4f3e-8186-f16675211c84\") }"}' \
            | cat
